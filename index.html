<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض إيفا براند | EVA BRAND</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #fcfcfc; color: #333; margin: 0; padding: 0; line-height: 1.6; }
        header { background-color: #fff; padding: 30px 20px; text-align: center; border-bottom: 1px solid #f0f0f0; }
        #display-logo { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; border: 2px solid #d4af37; margin-bottom: 10px; display: none; margin-left: auto; margin-right: auto; }
        header h1 { margin: 5px 0; color: #111; font-size: 28px; letter-spacing: 1px; }
        header p { color: #888; font-size: 14px; margin: 2px 0; }

        .banner { background: #000; color: #fff; text-align: center; padding: 10px; font-size: 13px; font-weight: bold; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        
        .cta-box {
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
            color: #fff; padding: 25px; border-radius: 15px; text-align: center; margin: 20px 0;
            box-shadow: 0 8px 20px rgba(184, 134, 11, 0.2);
        }
        .cta-box h3 { margin: 0 0 10px 0; font-size: 18px; }
        .cta-box p { font-size: 14px; margin-bottom: 15px; opacity: 0.9; }
        .cta-btn {
            display: inline-block; background: #fff; color: #b8860b; padding: 10px 25px;
            border-radius: 30px; text-decoration: none; font-weight: bold; font-size: 14px; transition: 0.3s;
        }

        /* شريط الأقسام الديناميكي */
        .nav-links { display: flex; gap: 8px; overflow-x: auto; padding: 15px 0; white-space: nowrap; justify-content: center; }
        .nav-links::-webkit-scrollbar { display: none; }
        .nav-link-btn { background: #fff; padding: 10px 18px; border-radius: 25px; border: 1px solid #eee; color: #555; cursor: pointer; font-size: 13px; transition: 0.3s; }
        .nav-link-btn.active { background: #d4af37; color: #fff; border-color: #d4af37; font-weight: bold; box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3); }

        .section { background: #fff; margin: 10px 0; padding: 20px; border-radius: 12px; border: 1px solid #f0f0f0; text-align: center; display: none; }
        .section.active-section { display: block; }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 15px; text-align: right; }
        .product-card { background: #fff; border: 1px solid #f0f0f0; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; }
        .product-card img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; cursor: pointer; }
        .product-card h3 { font-size: 13px; margin: 8px 0 4px 0; color: #222; }
        .product-card p { color: #27ae60; font-weight: bold; font-size: 13px; margin: 0 0 10px 0; }
        .whatsapp-btn { background: #25d366; color: #fff; padding: 8px; border-radius: 6px; text-align: center; text-decoration: none; font-size: 11px; font-weight: bold; margin-top: auto; }

        #imageModal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); text-align: center; padding-top: 40px; }
        #modalImg { max-width: 90%; max-height: 75vh; border-radius: 10px; }
        .close-btn { position: absolute; top: 20px; left: 30px; color: #fff; font-size: 40px; cursor: pointer; }
        .download-btn { display: inline-block; background: #d4af37; color: #fff; padding: 12px 25px; margin-top: 20px; border-radius: 8px; text-decoration: none; font-weight: bold; }

        footer { text-align: center; padding: 40px 20px; font-size: 12px; color: #999; }
    </style>
</head>
<body>

    <div class="banner">✨ التوصيل لكافة مناطق الضفة والداخل 🚚</div>

    <header>
        <img id="display-logo" src="" alt="EVA Logo">
        <h1>EVA BRAND</h1>
        <p>ديراستيا - وسط البلد - الشارع الرئيسي</p>
    </header>

    <div class="container">
        <div class="cta-box">
            <h3>كوني وسيطة لإيفا براند 👑</h3>
            <p>انضمي لفريقنا الآن واحصلي على خصومات حصرية وعمولات مميزة بضغطة زر!</p>
            <a href="https://wa.me/970597180456?text=مرحباً، أريد الانضمام لفريق المسوقات (الوسيطات) لإيفا براند" target="_blank" class="cta-btn">📩 انضمي إلينا الآن</a>
        </div>

        <div id="navContainer" class="nav-links"></div>

        <div id="sectionsContainer"></div>
    </div>

    <div id="imageModal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <img id="modalImg" src="">
            <br>
            <a id="downloadLink" href="" download="eva_product.jpg" class="download-btn">📥 تحميل الصورة للنشر</a>
        </div>
    </div>

    <footer>© 2026 EVA BRAND</footer>

    <script>
        function loadCatalog() {
            // تحميل اللوغو
            const logo = localStorage.getItem('eva_logo');
            if(logo) {
                const img = document.getElementById('display-logo');
                img.src = logo;
                img.style.display = 'block';
            }

            // جلب الأقسام والمنتجات المخزنة
            let categories = JSON.parse(localStorage.getItem('eva_categories')) || [
                {id: 'A', name: 'الحقائب'},
                {id: 'B', name: 'العطور'},
                {id: 'C', name: 'الساعات'},
                {id: 'D', name: 'الهدايا'},
                {id: 'E', name: 'الإكسسوارات'}
            ];
            let products = JSON.parse(localStorage.getItem('eva_products')) || [];

            let navHtml = '';
            let secHtml = '';

            categories.forEach((cat, index) => {
                let isActive = index === 0 ? 'active' : '';
                let isSecActive = index === 0 ? 'active-section' : '';

                // زر القسم العلوي
                navHtml += `<button class="nav-link-btn ${isActive}" onclick="switchTab('${cat.id}', this)">${cat.name}</button>`;

                // محتوى القسم والمنتجات بداخله
                let catProducts = products.filter(p => p.category === cat.id);
                let productsContent = '';

                if(catProducts.length === 0) {
                    productsContent = '<p style="color:#999; padding: 20px;">لا يوجد منتجات في هذا القسم حالياً</p>';
                } else {
                    productsContent = `<div class="products-grid">` + catProducts.map(p => `
                        <div class="product-card">
                            <img src="${p.image}" onclick="openModal('${p.image}')">
                            <h3>${p.name}</h3>
                            <p>${p.price} ₪ <small style="color:#aaa; font-weight:normal;">(${p.code})</small></p>
                            <a href="https://wa.me/970597180456?text=أود طلب المنتج ${p.code}" target="_blank" class="whatsapp-btn">اطلب واتساب</a>
                        </div>
                    `).join('') + `</div>`;
                }

                secHtml += `
                    <div id="${cat.id}" class="section ${isSecActive}">
                        <h2>✨ ${cat.name}</h2>
                        ${productsContent}
                    </div>
                `;
            });

            document.getElementById('navContainer').innerHTML = navHtml;
            document.getElementById('sectionsContainer').innerHTML = secHtml;
        }

        function switchTab(id, btn) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active-section'));
            document.querySelectorAll('.nav-link-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active-section');
            btn.classList.add('active');
        }

        function openModal(src) { document.getElementById('imageModal').style.display='block'; document.getElementById('modalImg').src=src; document.getElementById('downloadLink').href=src; }
        function closeModal() { document.getElementById('imageModal').style.display='none'; }

        loadCatalog();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد الإعلانات والبوسترات - EVA PLUS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #fdfbf7;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h2 {
            color: #2c2c2c;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #b89753;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
        }
        /* اختيار القوالب */
        .templates-selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .template-btn {
            background: #f4efe6;
            border: 2px solid #e6dbcc;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            color: #333;
            transition: 0.2s;
        }
        .template-btn.active, .template-btn:hover {
            background: #b89753;
            color: #fff;
            border-color: #b89753;
        }
        
        /* حاوية البوستر النهائي */
        .poster-wrapper {
            position: relative;
            width: 100%;
            max-width: 360px;
            aspect-ratio: 9/16;
            margin: 0 auto 20px auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            background: #fff;
        }
        .poster-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* صندوق دمج المنتج داخل المربع الأبيض في الصورة */
        .product-overlay-box {
            position: absolute;
            top: 36%;
            left: 14%;
            width: 72%;
            height: 38%;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 10px;
            padding: 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e6dbcc;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* مكان عرض صورة المنتج الحقيقية */
        .prod-img-container {
            width: 100%;
            height: 58%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fdfbf7;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #f4efe6;
        }
        .prod-img-container img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .prod-info {
            width: 100%;
            text-align: center;
        }
        .prod-title {
            font-size: 12px;
            font-weight: bold;
            color: #2c2c2c;
            margin: 2px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .prod-price-row {
            display: flex;
            justify-content: space-around;
            font-size: 11px;
            margin-top: 2px;
        }
        .price {
            color: #333;
            font-weight: bold;
        }
        .profit {
            color: #27ae60;
            font-weight: bold;
        }

        /* زر التوليد والتحميل */
        .action-btn {
            background: linear-gradient(135deg, #b89753, #967538);
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(184, 151, 83, 0.3);
        }
        .action-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>مولد الإعلانات الاحترافي</h2>
    <p class="subtitle">الأناقة بس من عنا ✨ - اختر القالب واضغط توليد لدمج المنتج عشوائياً</p>

    <!-- أزرار اختيار القوالب الأربعة المرفوعة -->
    <div class="templates-selector">
        <button class="template-btn active" onclick="changeTemplate(1)">قالب 1</button>
        <button class="template-btn" onclick="changeTemplate(2)">قالب 2</button>
        <button class="template-btn" onclick="changeTemplate(3)">قالب 3</button>
        <button class="template-btn" onclick="changeTemplate(4)">قالب 4</button>
    </div>

    <!-- عرض البوستر مع خلفية الصورة المرفوعة -->
    <div class="poster-wrapper" id="posterArea">
        <img id="posterImage" src="eva-template-1.png" class="poster-bg" alt="EVA Template">
        
        <!-- الطبقة التي تظهر داخل المربع الأبيض بدقة -->
        <div class="product-overlay-box">
            <div class="prod-img-container">
                <img id="boxImg" src="" alt="صورة المنتج">
            </div>
            <div class="prod-info">
                <div class="prod-title" id="boxTitle">اسم المنتج يظهر هنا</div>
                <div class="prod-price-row">
                    <span class="price" id="boxPrice">السعر: ₪150</span>
                    <span class="profit" id="boxProfit">ربح الشريك: ₪30</span>
                </div>
            </div>
        </div>
    </div>

    <!-- أزرار التحكم -->
    <button class="action-btn" onclick="generateRandomAd()">🎲 توليد منتج عشوائي جديد</button>
    <button class="action-btn" style="background: #2c2c2c; color: #b89753; border: 1px solid #b89753;" onclick="downloadFinalPoster()">📥 حفظ ونشر البوستر</button>
</div>

<script>
// مصفوفة المنتجات مع صور حقيقية (يمكنك تعديل روابط الصور أو أسماء ملفاتها لتطابق صور منتجاتك في الكتالوج)
const catalogProducts = [
    { 
        name: "سماعات الأذن Ultra Wireless Pods", 
        price: "₪140", 
        profit: "₪25", 
        img: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=300" // مثال صورة سماعات
    },
    { 
        name: "عطر GLOW IN ROME النسائي الفاخر", 
        price: "₪120", 
        profit: "₪30", 
        img: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=300" // مثال صورة عطر
    },
    { 
        name: "محفظة رجالية جلدية أصلية مع حزام", 
        price: "₪90", 
        profit: "₪20", 
        img: "https://images.unsplash.com/photo-1627123424574-724758594e93?w=300" // مثال صورة محفظة
    },
    { 
        name: "ساعة يد كلاسيكية معدنية ذهبية", 
        price: "₪180", 
        profit: "₪40", 
        img: "https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=300" // مثال صورة ساعة
    }
];

let currentTemplateNum = 1;

function changeTemplate(num) {
    currentTemplateNum = num;
    document.getElementById('posterImage').src = `eva-template-${num}.png`;
    
    document.querySelectorAll('.template-btn').forEach((btn, index) => {
        if(index + 1 === num) {
            btn.classList.add('active');
        } else {
            btn.classList.remove('active');
        }
    });
}

function generateRandomAd() {
    // اختيار منتج عشوائي
    const randomItem = catalogProducts[Math.floor(Math.random() * catalogProducts.length)];
    
    // تعبئة البيانات وصورة المنتج الحقيقية داخل القالب
    document.getElementById('boxTitle').innerText = randomItem.name;
    document.getElementById('boxPrice').innerText = "السعر: " + randomItem.price;
    document.getElementById('boxProfit').innerText = "الربح: " + randomItem.profit;
    document.getElementById('boxImg').src = randomItem.img;
}

function downloadFinalPoster() {
    alert("في النسخة النهائية المكتملة، سيقوم النظام بتصدير هذا البوستر المدمج كصورة PNG عالية الدقة ليقوم الشريك بحفظها ونشرها مباشرة على ستوري واتساب أو إنستغرام!");
}

// توليد أول منتج تلقائياً عند فتح الصفحة
window.onload = function() {
    generateRandomAd();
};
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد الإعلانات والبوسترات - EVA PLUS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #fdfbf7;
            margin: 0;
            padding: 20px;
            direction: rtl;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h2 {
            color: #2c2c2c;
            margin-bottom: 5px;
            font-size: 20px;
        }
        .subtitle {
            color: #b89753;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 20px;
        }
        /* أزرار اختيار القوالب */
        .templates-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .template-btn {
            background: #f4efe6;
            border: 2px solid #e6dbcc;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: bold;
            color: #333;
            font-size: 13px;
            transition: 0.2s;
        }
        .template-btn.active, .template-btn:hover {
            background: #b89753;
            color: #fff;
            border-color: #b89753;
        }
        
        /* حاوية البوستر النهائي (نسبة 9:16 للموبايل) */
        .poster-wrapper {
            position: relative;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 9/16;
            margin: 0 auto 20px auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            background: #fff;
        }
        .poster-bg {
            width: 100%;
            height: 100%;
            object-fit: fill; /* لضمان تطابق الصورة بالكامل مع الإطار */
            display: block;
        }

        /* صندوق دمج المنتج داخل المربع الأبيض في الصورة بدقة تامة */
        .product-overlay-box {
            position: absolute;
            top: 41%;       /* تم ضبطها لتنزل داخل المربع الأبيض تماماً */
            left: 20%;      /* تم ضبط العرض والسنتر بدقة */
            width: 60%;
            height: 31%;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 8px;
            padding: 6px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        /* حاوية صورة المنتج الحقيقية */
        .prod-img-container {
            width: 100%;
            height: 52%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #faf8f5;
            border-radius: 6px;
            overflow: hidden;
        }
        .prod-img-container img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .prod-info {
            width: 100%;
            text-align: center;
        }
        .prod-title {
            font-size: 11.5px;
            font-weight: bold;
            color: #2c2c2c;
            margin: 2px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .prod-price-row {
            display: flex;
            justify-content: space-around;
            font-size: 10.5px;
            margin-top: 2px;
        }
        .price {
            color: #444;
            font-weight: bold;
        }
        .profit {
            color: #27ae60;
            font-weight: bold;
        }

        /* أزرار التحكم */
        .action-btn {
            background: linear-gradient(135deg, #b89753, #967538);
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(184, 151, 83, 0.3);
        }
        .action-btn:hover {
            opacity: 0.9;
        }
        .loading-text {
            color: #666;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>مولد الإعلانات الاحترافي</h2>
    <p class="subtitle">الأناقة بس من عنا ✨ - اختر القالب واضغط توليد لإدراج منتج حقيقي عشوائياً</p>

    <!-- أزرار اختيار القوالب الأربعة المرفوعة -->
    <div class="templates-selector">
        <button class="template-btn active" onclick="changeTemplate(1)">قالب 1</button>
        <button class="template-btn" onclick="changeTemplate(2)">قالب 2</button>
        <button class="template-btn" onclick="changeTemplate(3)">قالب 3</button>
        <button class="template-btn" onclick="changeTemplate(4)">قالب 4</button>
    </div>

    <!-- عرض البوستر مع خلفية القالب المختار -->
    <div class="poster-wrapper" id="posterArea">
        <img id="posterImage" src="eva-template-1.png" class="poster-bg" alt="EVA Template">
        
        <!-- الطبقة التي تستقر بداخل المربع الأبيض بدقة -->
        <div class="product-overlay-box">
            <div class="prod-img-container">
                <img id="boxImg" src="" alt="صورة المنتج">
            </div>
            <div class="prod-info">
                <div class="prod-title" id="boxTitle">جاري تحميل المنتج...</div>
                <div class="prod-price-row">
                    <span class="price" id="boxPrice">السعر: -</span>
                    <span class="profit" id="boxProfit">الربح: -</span>
                </div>
            </div>
        </div>
    </div>

    <!-- زر توليد منتج عشوائي حقيقي -->
    <button class="action-btn" onclick="pickRandomRealProduct()">🎲 جلب منتج حقيقي عشوائي</button>
    <div id="statusMsg" class="loading-text">جاري الاتصال بقاعدة البيانات...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAqPpKqqHBEIJZTCGCROFzqZyHOYlnDgP4",
        authDomain: "eva-plus-66b96.firebaseapp.com",
        projectId: "eva-plus-66b96",
        storageBucket: "eva-plus-66b96.firebasestorage.app",
        messagingSenderId: "686798536842",
        appId: "1:686798536842:web:8c09932cd5869292eb6d73"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let realProductsList = [];

    // جلب المنتجات الحقيقية من فايربيس عند فتح الصفحة
    async function fetchRealProducts() {
        try {
            const querySnapshot = await getDocs(collection(db, "products"));
            realProductsList = [];
            querySnapshot.forEach((doc) => {
                let data = doc.data();
                let img = (data.images && data.images.length > 0) ? data.images[0] : '';
                let profitVal = data.agentPrice || data.profit || data.evaProfit || '10';
                if (img && data.name) {
                    realProductsList.push({
                        name: data.name,
                        image: img,
                        price: data.price || '0',
                        profit: profitVal
                    });
                }
            });

            if (realProductsList.length > 0) {
                document.getElementById('statusMsg.innerText = "تم الاتصال بنجاح وتوافر " + realProductsList.length + " منتج حقيقي!";'
                // إخفاء رسالة الحالة بعد ثانيتين
                setTimeout(() => { document.getElementById('statusMsg').style.display = 'none'; }, 2000);
                pickRandomRealProduct(); // عرض أول منتج عشوائي فوراً
            } else {
                document.getElementById('statusMsg').innerText = "لم يتم العثور على منتجات في قاعدة البيانات.";
            }
        } catch (err) {
            console.error("Error fetching products:", err);
            document.getElementById('statusMsg').innerText = "خطأ في الاتصال بقاعدة البيانات.";
        }
    }

    // دالة لاختيار وعرض منتج عشوائي حقيقي من القائمة المجلوبة
    window.pickRandomRealProduct = function() {
        if (realProductsList.length === 0) {
            alert("جاري تحميل المنتجات، يرجى الانتظار قليلاً...");
            return;
        }
        const randomIndex = Math.floor(Math.random() * realProductsList.length);
        const p = realProductsList[randomIndex];

        document.getElementById('boxTitle').innerText = p.name;
        document.getElementById('boxPrice').innerText = "السعر: " + p.price + " ₪";
        document.getElementById('boxProfit').innerText = "الربح: " + p.profit + " ₪";
        document.getElementById('boxImg').src = p.image;
    };

    window.addEventListener('DOMContentLoaded', fetchRealProducts);
</script>

<script>
    // تبديل القوالب الأربعة
    function changeTemplate(num) {
        document.getElementById('posterImage').src = `eva-template-${num}.png`;
        document.querySelectorAll('.template-btn').forEach((btn, index) => {
            if (index + 1 === num) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }
</script>

</body>
</html>

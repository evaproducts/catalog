<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد الإعلانات - EVA PLUS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #fdfbf7; margin: 0; padding: 20px; direction: rtl; text-align: center; }
        .container { max-width: 480px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #2c2c2c; font-size: 18px; margin-bottom: 5px; }
        .subtitle { color: #b89753; font-size: 12px; font-weight: bold; margin-bottom: 15px; }
        
        /* أزرار القوالب */
        .templates-selector { display: flex; justify-content: center; gap: 6px; margin-bottom: 15px; flex-wrap: wrap; }
        .template-btn { background: #f4efe6; border: 1px solid #e6dbcc; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: bold; font-size: 12px; color: #333; }
        .template-btn.active, .template-btn:hover { background: #b89753; color: #fff; border-color: #b89753; }

        /* حاوية البوستر */
        .poster-wrapper { position: relative; width: 100%; max-width: 320px; aspect-ratio: 9/16; margin: 0 auto 15px auto; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.15); background: #fff; }
        .poster-bg { width: 100%; height: 100%; object-fit: fill; display: block; }

        /* تم ضبط الـ top و height لكي ينزل المربع إلى المكان المخصص بدقة في القوالب الأربعة */
        .product-overlay-box {
            position: absolute;
            top: 44%;
            left: 20%;
            width: 60%;
            height: 31%;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 6px;
            padding: 5px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        .prod-img-container { width: 100%; height: 55%; display: flex; align-items: center; justify-content: center; background: #faf8f5; border-radius: 4px; overflow: hidden; }
        .prod-img-container img { max-height: 100%; max-width: 100%; object-fit: contain; }
        
        .prod-info { width: 100%; text-align: center; }
        .prod-title { font-size: 10px; font-weight: bold; color: #2c2c2c; margin: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .prod-price-row { display: flex; justify-content: space-around; font-size: 9.5px; }
        .price { color: #444; font-weight: bold; }
        .profit { color: #22c55e; font-weight: bold; }

        /* الأزرار */
        .action-btn { background: #b89753; color: #fff; border: none; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 8px; font-family: 'Cairo', sans-serif; }
        .action-btn:hover { opacity: 0.9; }
        .download-btn { background: #2c2c2c; color: #b89753; border: 1px solid #b89753; }
        .status-msg { color: #666; font-size: 11px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>مولد الإعلانات الاحترافي</h2>
    <p class="subtitle">اختر القالب واستعرض منتجاتك الحقيقية من الكتالوج</p>

    <!-- أزرار اختيار القوالب الأربعة وتعمل بكفاءة -->
    <div class="templates-selector">
        <button class="template-btn active" onclick="changeTemplate(1)">قالب 1</button>
        <button class="template-btn" onclick="changeTemplate(2)">قالب 2</button>
        <button class="template-btn" onclick="changeTemplate(3)">قالب 3</button>
        <button class="template-btn" onclick="changeTemplate(4)">قالب 4</button>
    </div>

    <!-- عرض البوستر -->
    <div class="poster-wrapper" id="posterArea">
        <img id="posterImage" src="eva-template-1.png" class="poster-bg" alt="Template">
        
        <div class="product-overlay-box">
            <div class="prod-img-container">
                <img id="boxImg" src="" alt="صورة المنتج">
            </div>
            <div class="prod-info">
                <div class="prod-title" id="boxTitle">جاري تحميل المنتجات...</div>
                <div class="prod-price-row">
                    <span class="price" id="boxPrice">السعر: -</span>
                    <span class="profit" id="boxProfit">الربح: -</span>
                </div>
            </div>
        </div>
    </div>

    <button class="action-btn" onclick="pickRandomProduct()">🎲 جلب منتج عشوائي آخر</button>
    <button class="action-btn download-btn" onclick="downloadPosterImage()">📥 تحميل البوستر كصورة</button>
    <div id="statusMsg" class="status-msg">جاري الاتصال بقاعدة البيانات...</div>
</div>

<!-- مكتبة html2canvas لتحميل الصورة -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- ربط فايربيس وجلب المنتجات الحقيقية -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAqPpKqqHBEIJZTCGCROFzqZyHOYlnDgP4",
        authDomain: "eva-plus-66b96.firebaseapp.com",
        projectId: "eva-plus-66b96",
        storageBucket: "eva-plus-66b96.firebasestorage.app",
        messagingSenderId: "686798536842",
        appId: "1:686798536842:web:8c09932cd5869292eb6d73"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let productsList = [];

    async function loadProducts() {
        try {
            const querySnapshot = await getDocs(collection(db, "products"));
            productsList = [];
            querySnapshot.forEach((doc) => {
                let data = doc.data();
                let img = (data.images && data.images.length > 0) ? data.images[0] : '';
                let profitVal = data.agentPrice || data.profit || data.evaProfit || '10';
                if (img && data.name) {
                    productsList.push({
                        name: data.name,
                        image: img,
                        price: data.price || '0',
                        profit: profitVal
                    });
                }
            });

            if (productsList.length > 0) {
                document.getElementById('statusMsg').innerText = "تم الاتصال بنجاح (" + productsList.length + " منتج متاح)";
                setTimeout(() => { document.getElementById('statusMsg').style.display = 'none'; }, 2000);
                pickRandomProduct();
            } else {
                document.getElementById('statusMsg').innerText = "لا توجد منتجات مطابقة في قاعدة البيانات.";
            }
        } catch (err) {
            console.error("Firebase Error:", err);
            document.getElementById('statusMsg').innerText = "خطأ في الاتصال بقاعدة البيانات.";
        }
    }

    window.pickRandomProduct = function() {
        if (productsList.length === 0) return;
        const randomIndex = Math.floor(Math.random() * productsList.length);
        const p = productsList[randomIndex];

        document.getElementById('boxTitle').innerText = p.name;
        document.getElementById('boxPrice').innerText = "السعر: " + p.price + " ₪";
        document.getElementById('boxProfit').innerText = "الربح: " + p.profit + " ₪";
        document.getElementById('boxImg').src = p.image;
    };

    window.addEventListener('DOMContentLoaded', loadProducts);
</script>

<script>
    // تبديل القوالب بسلاسة وتحديد القالب النشط
    function changeTemplate(num) {
        document.getElementById('posterImage').src = `eva-template-${num}.png`;
        const buttons = document.querySelectorAll('.template-btn');
        buttons.forEach((btn, index) => {
            if (index + 1 === num) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

    // تحميل البوستر كصورة
    function downloadPosterImage() {
        const posterElement = document.getElementById('posterArea');
        html2canvas(posterElement, { useCORS: true, scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'eva-plus-ad.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    }
</script>

</body>
</html>

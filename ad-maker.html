<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد الإعلانات الذكي | EVA PLUS</title>
    <meta name="theme-color" content="#0088cc">
    <style>
        :root {
            --linky-blue: #0088cc;
            --linky-bg: #f4f6f9;
            --linky-card-bg: #ffffff;
            --linky-border: #e1e8ed;
            --accent-gold: #d4af37;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--linky-bg); color: #333; margin: 0; padding: 15px; direction: rtl; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 500px; width: 100%; margin: 0 auto; text-align: center; }

        .top-navbar { display: flex; justify-content: space-between; align-items: center; background: var(--linky-card-bg); padding: 12px 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid var(--linky-border); width: 100%; box-sizing: border-box; }
        .back-btn { background: #e1e8ed; color: #333; text-decoration: none; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: bold; }

        h1 { font-size: 20px; color: var(--linky-blue); margin-bottom: 5px; }
        p.subtitle { font-size: 13px; color: #666; margin-top: 0; margin-bottom: 20px; }

        /* منطقة البوستر الإعلاني القابل للتصدير كصورة */
        #adPosterCard {
            width: 100%;
            max-width: 450px;
            background: linear-gradient(135deg, #11141d 0%, #1a1f2c 100%);
            border-radius: 24px;
            padding: 25px;
            box-sizing: border-box;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            border: 3px solid var(--accent-gold);
            margin: 0 auto 20px auto;
            position: relative;
            text-align: center;
            color: #fff;
        }

        .poster-brand { font-size: 22px; font-weight: 900; color: var(--accent-gold); letter-spacing: 1px; margin-bottom: 5px; }
        .poster-tagline { font-size: 11.5px; color: #9ca3af; margin-bottom: 20px; }

        .poster-img-box {
            width: 220px;
            height: 220px;
            background: #fff;
            border-radius: 16px;
            margin: 0 auto 15px auto;
            padding: 10px;
            box-sizing: border-box;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .poster-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .poster-prod-name { font-size: 18px; font-weight: bold; color: #60a5fa; margin-bottom: 8px; }
        .poster-prod-code { font-size: 12px; color: #9ca3af; background: #232d42; padding: 4px 12px; border-radius: 6px; display: inline-block; margin-bottom: 12px; }
        
        .poster-price-row { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; font-size: 14px; }
        .poster-price { color: #e5e7eb; }
        .poster-profit { color: #22c55e; font-weight: bold; background: rgba(34, 197, 94, 0.15); padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(34, 197, 94, 0.3); }

        .poster-footer-call { font-size: 12px; color: #d4af37; border-top: 1px dashed rgba(212,175,55,0.3); padding-top: 12px; margin-top: 10px; font-weight: bold; }

        /* أزرار التحكم والعمليات */
        .action-btns-group { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 450px; margin: 0 auto; }
        .btn-action { background: var(--linky-blue); color: white; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(0,136,204,0.2); }
        .btn-action:hover { opacity: 0.95; transform: translateY(-2px); }
        .btn-download { background: #27ae60; box-shadow: 0 4px 15px rgba(39,174,96,0.2); }

        .loading-text { color: #666; font-size: 14px; padding: 40px; }
    </style>

    <!-- مكتبة html2canvas لتحويل البوستر إلى صورة حقيقية قابلة للتحميل الفوري -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <div class="container">
        <!-- شريط علوي -->
        <div class="top-navbar">
            <a href="index.html" class="back-btn">← الرئيسية</a>
            <span style="font-weight: bold; font-size: 14px; color: #444;">مولد الإعلانات التلقائي</span>
        </div>

        <h1>🎨 توليد بوستر إعلاني ذكي</h1>
        <p class="subtitle">اضغط على زر التوليد لجلب منتج عشوائي وصنع إعلان احترافي فوري!</p>

        <!-- هيكل البوستر الإعلاني -->
        <div id="adPosterCard">
            <div class="poster-brand">EVA PLUS</div>
            <div class="poster-tagline">✨ فرصتك للربح الذكي من المنزل بلا تعقيد ✨</div>
            
            <div id="posterContentArea">
                <div class="loading-text">جاري اختيار منتج عشوائي وتحضير البوستر...</div>
            </div>
            
            <div class="poster-footer-call">📲 تواصل معنا الآن للانضمام وبناء فريقك</div>
        </div>

        <!-- الأزرار التفاعلية -->
        <div class="action-btns-group">
            <button class="btn-action" onclick="generateRandomAdPoster()">🔄 اختيار منتج عشوائي آخر</button>
            <button class="btn-action btn-download" id="downloadBtn" onclick="downloadPosterImage()" style="display: none;">📥 تحميل البوستر كصورة (PNG)</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAqPpKqqHBEIJZTCGCROFzqZyHOYlnDgP4",
            authDomain: "eva-plus-66b96.firebaseapp.com",
            projectId: "eva-plus-66b96",
            storageBucket: "eva-plus-66b96.firebasestorage.app",
            messagingSenderId: "686798536842",
            appId: "1:686798536842:web:8c09932cd5869292eb6d73"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let cachedProducts = [];

        async function fetchProductsForAds() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                cachedProducts = [];
                querySnapshot.forEach((doc) => {
                    let data = doc.data();
                    let img = (data.images && data.images.length > 0) ? data.images[0] : '';
                    let profitVal = data.agentPrice || data.profit || data.evaProfit || 0;
                    if (img && data.name) {
                        cachedProducts.push({
                            code: data.code || doc.id,
                            name: data.name,
                            image: img,
                            price: data.price || '0',
                            profit: profitVal
                        });
                    }
                });
                if (cachedProducts.length > 0) {
                    generateRandomAdPoster();
                } else {
                    document.getElementById('posterContentArea').innerHTML = `<div style="color: #ef4444; padding: 20px;">لا توجد منتجات متاحة حالياً في النظام.</div>`;
                }
            } catch (err) {
                console.error("Error fetching products:", err);
                document.getElementById('posterContentArea').innerHTML = `<div style="color: #ef4444; padding: 20px;">حدث خطأ أثناء الاتصال بقاعدة البيانات.</div>`;
            }
        }

        window.generateRandomAdPoster = function() {
            if (cachedProducts.length === 0) return;
            
            // اختيار منتج عشوائي
            let randomProd = cachedProducts[Math.floor(Math.random() * cachedProducts.length)];

            // تعبئة عناصر البوستر
            let contentArea = document.getElementById('posterContentArea');
            contentArea.innerHTML = `
                <div class="poster-img-box">
                    <img src="${randomProd.image}" alt="${randomProd.name}" crossorigin="anonymous">
                </div>
                <div class="poster-prod-name">${randomProd.name}</div>
                <div class="poster-prod-code">كود المنتج: ${randomProd.code}</div>
                <div class="poster-price-row">
                    <span class="poster-price">السعر: <b>${randomProd.price} ₪</b></span>
                    <span class="poster-profit">أرباح الشريك: ${randomProd.profit} ₪</span>
                </div>
            `;

            // إظهار زر التنزيل
            document.getElementById('downloadBtn').style.display = 'block';
        }

        // دالة تحويل البوستر إلى صورة حقيقية وتنزيلها
        window.downloadPosterImage = function() {
            let posterElement = document.getElementById('adPosterCard');
            let downloadBtn = document.getElementById('downloadBtn');
            
            downloadBtn.innerText = "جاري تجهيز الصورة...";
            downloadBtn.disabled = true;

            html2canvas(posterElement, {
                useCORS: true,
                scale: 2 // لزيادة دقة ونقاء الصورة الناتجة
            }).then(canvas => {
                let link = document.createElement('a');
                link.download = 'eva-plus-ad-' + Math.floor(1000 + Math.random() * 9000) + '.png';
                link.href = canvas.toDataURL('image/png');
                link.link;
                link.click();

                downloadBtn.innerText = "📥 تحميل البوستر كصورة (PNG)";
                downloadBtn.disabled = false;
            }).catch(err => {
                console.error("Error generating image:", err);
                alert("حدث خطأ أثناء توليد الصورة.");
                downloadBtn.innerText = "📥 تحميل البوستر كصورة (PNG)";
                downloadBtn.disabled = false;
            });
        }

        window.addEventListener('DOMContentLoaded', fetchProductsForAds);
    </script>

</body>
</html>

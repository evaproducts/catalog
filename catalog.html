<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتالوج المنتجات | إيفا براند</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #fce4ec 100%);
            color: #333;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            min-height: 100vh;
        }
        
        header {
            background: #fff;
            padding: 25px 20px;
            text-align: center;
            border-bottom: 2px solid #f8bbd0;
            position: relative;
        }

        .agent-login-bar {
            background: #fff0f5;
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #f8bbd0;
            font-size: 14px;
        }
        .agent-login-btn {
            background: #ad1457;
            color: #fff;
            border: none;
            padding: 6px 15px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .agent-login-btn:hover {
            background: #880e4f;
        }

        #display-logo {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #d4af37;
            margin-bottom: 10px;
            display: none;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        header h1 {
            margin: 5px 0;
            color: #880e4f;
            font-size: 26px;
        }
        header p {
            color: #ad1457;
            font-size: 14px;
            margin: 0;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .admin-notice-box {
            background: #fff;
            border-right: 5px solid #ad1457;
            border-left: 1px solid #f8bbd0;
            border-top: 1px solid #f8bbd0;
            border-bottom: 1px solid #f8bbd0;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 14px;
            color: #444;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        /* زر العودة للقائمة الرئيسية */
        .back-to-categories {
            background: #880e4f;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .back-to-categories:hover {
            background: #ad1457;
        }

        /* شبكة عرض الأقسام الرئيسية */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .category-card {
            background: #fff;
            border: 1px solid #f8bbd0;
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(0,0,0,0.03);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .category-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(216, 27, 96, 0.15);
            border-color: #ad1457;
        }
        .category-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #d4af37;
            margin-bottom: 8px;
            background-color: #fafafa;
        }
        .category-card h3 {
            font-size: 14px;
            color: #880e4f;
            margin: 5px 0 2px 0;
        }
        .category-code-tag {
            font-size: 12px;
            color: #b8860b;
            font-weight: bold;
        }

        .section { display: none; }
        .section.active-section { display: block; }
        .section h2 {
            font-size: 18px;
            color: #880e4f;
            margin-bottom: 15px;
            border-bottom: 2px solid #f8bbd0;
            padding-bottom: 8px;
        }

        /* شبكة عرض المنتجات: عمودين بجانب بعضهما */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        @media (min-width: 600px) {
            .products-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
            }
        }

        .product-card {
            background: #fff;
            border: 1px solid #f8bbd0;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.03);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(216, 27, 96, 0.1);
        }

        .product-images {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            margin-bottom: 8px;
            padding-bottom: 3px;
        }
        .product-images img {
            width: 35px;
            height: 35px;
            object-fit: cover;
            background-color: #fafafa;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #f8bbd0;
            transition: 0.2s;
        }
        .product-images img:hover {
            border-color: #ad1457;
        }

        /* حاوية الصورة الرئيسية مربعة تملأ المساحة باحترافية */
        .main-product-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background-color: #fafafa;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid #fce4ec;
        }

        .product-card h3 {
            font-size: 13px;
            margin: 4px 0;
            color: #333;
        }
        .prices {
            font-size: 12px;
            color: #555;
            margin: 6px 0;
            background: #fff0f5;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #f8bbd0;
        }
        .price-ex {
            color: #333;
            font-weight: bold;
            font-size: 13px;
            display: block;
        }
        .price-agent {
            color: #ad1457;
            font-weight: bold;
            font-size: 13px;
            display: block;
            margin-top: 3px;
            border-top: 1px dashed #f8bbd0;
            padding-top: 3px;
        }
        .product-code {
            color: #b8860b;
            font-size: 11px;
            font-weight: bold;
            display: block;
            margin-top: 3px;
        }

        .whatsapp-btn {
            background: #25d366;
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
            display: block;
            width: 100%;
            box-sizing: border-box;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(37, 211, 102, 0.3);
            transition: 0.3s;
        }
        .whatsapp-btn:hover {
            background: #20ba5a;
        }

        .footer-visitor-box {
            text-align: center;
            margin: 30px 0 10px 0;
            font-size: 14px;
            color: #666;
            font-weight: bold;
        }

        .footer-link {
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .footer-link a {
            color: #ad1457;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-bottom: 25px;
        }

        /* نافذة تكبير الصورة (Modal) بخلفية بيضاء نقية ونظيفة */
        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal img {
            max-width: 95%;
            max-height: 90vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }
        .close-modal {
            color: #ad1457;
            font-size: 40px;
            position: absolute;
            top: 15px;
            left: 25px;
            cursor: pointer;
            font-weight: bold;
            z-index: 1000;
        }

        .login-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .login-box button {
            background: #ad1457;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .login-box button:hover { background: #880e4f; }
    </style>
</head>
<body>

    <div class="agent-login-bar" id="agentLoginBar">
        <span id="loginStatusText">خاص بالوسيطات المعتمدات:</span>
        <button class="agent-login-btn" onclick="openLoginModal()" id="loginBtnUI">دخول الوسيطات</button>
    </div>

    <header>
        <img id="display-logo" alt="Logo">
        <h1>معرض إيفا براند</h1>
        <p>عالم من الهدايا الفاخرة - كتالوج الوسيطات الحصري</p>
    </header>

    <div class="container">

        <div id="adminNoticeBox" class="admin-notice-box" style="display: none;">
            <strong>📢 رسالة الإدارة:</strong> <span id="adminNoticeText"></span>
        </div>

        <!-- واجهة عرض شبكة الأقسام الرئيسية عند فتح الرابط أولاً -->
        <div id="categoriesHomeView">
            <h2 style="font-size: 18px; color: #880e4f; margin-bottom: 15px; border-bottom: 2px solid #f8bbd0; padding-bottom: 8px;">✨ أقسام المعرض</h2>
            <div id="categoriesGrid" class="categories-grid"></div>
        </div>

        <!-- حاوية الأقسام والمنتجات التي تفتح عند النقر -->
        <div id="sectionsContainer"></div>

        <div class="footer-visitor-box">
            الزيارات: <span id="visitCount">...</span>
        </div>

        <div class="footer-link">
            تصفحي روابطنا الأخرى: <a href="https://linky.ps/eva" target="_blank">linky.ps/eva</a>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة © معرض إيفا براند 2026
    </footer>

    <div id="imageModal" class="modal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <img id="modalImg">
    </div>

    <div id="loginModal" class="login-modal">
        <div class="login-box">
            <h3 style="color: #880e4f; margin-top:0;">تسجيل دخول الوسيطة</h3>
            <input type="text" id="loginUser" placeholder="اسم المستخدم">
            <input type="password" id="loginPass" placeholder="كلمة المرور">
            <button onclick="handleAgentLogin()">دخول</button>
            <br><br>
            <button style="background: #95a5a6; padding: 6px;" onclick="closeLoginModal()">إلغاء</button>
        </div>
    </div>

    <!-- ربط Firebase وجلب البيانات للكتالوج مع عداد الزيارات التزايدي المركزي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDGvv11z5ysUxYp6MscdetAUmJtfmCuXZ4",
            authDomain: "evabrandcatalog.firebaseapp.com",
            projectId: "evabrandcatalog",
            storageBucket: "evabrandcatalog.firebasestorage.app",
            messagingSenderId: "795421907629",
            appId: "1:795421907629:web:e75bc5be8c4556ab660424"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // دالة عداد الزيارات التي تزيد الرقم في السحابة مع كل تحديث أو فتح للصفحة
        async function setupVisitorCounter() {
            try {
                const statsRef = doc(db, "settings", "stats");
                const statsDoc = await getDoc(statsRef);
                
                let totalVisits = 50;
                if (statsDoc.exists()) {
                    totalVisits = statsDoc.data().visits || 50;
                } else {
                    await setDoc(statsRef, { visits: 50 });
                }

                await updateDoc(statsRef, {
                    visits: increment(1)
                });
                totalVisits += 1;

                document.getElementById('visitCount').innerText = totalVisits;
            } catch (error) {
                console.error("Error with visitor counter:", error);
                document.getElementById('visitCount').innerText = "50";
            }
        }

        let globalLogoUrl = "";

        async function loadCatalogData() {
            try {
                setupVisitorCounter();

                // 1. جلب اللوغو وإرسالية الإدارة
                const logoDoc = await getDoc(doc(db, "settings", "logo"));
                if (logoDoc.exists() && logoDoc.data().img) {
                    globalLogoUrl = logoDoc.data().img;
                    const logoEl = document.getElementById('display-logo');
                    logoEl.src = globalLogoUrl;
                    logoEl.style.display = 'block';
                }

                const noticeDoc = await getDoc(doc(db, "settings", "notice"));
                if (noticeDoc.exists() && noticeDoc.data().text) {
                    document.getElementById('adminNoticeText').innerText = noticeDoc.data().text;
                    document.getElementById('adminNoticeBox').style.display = 'block';
                }

                // 2. جلب الأقسام
                const catSnapshot = await getDocs(collection(db, "categories"));
                let categories = [];
                catSnapshot.forEach(docItem => categories.push({ id: docItem.id, ...docItem.data() }));

                // 3. جلب المنتجات
                const prodSnapshot = await getDocs(collection(db, "products"));
                let products = [];
                prodSnapshot.forEach(docItem => products.push(docItem.data()));

                const isAgentLogged = localStorage.getItem('eva_logged_agent') !== null;

                // بناء شبكة الأقسام الرئيسية مع إظهار حرف القسم تحت الاسم
                const categoriesGrid = document.getElementById('categoriesGrid');
                let categoriesHtml = '';

                categories.forEach(cat => {
                    let catImg = cat.image ? cat.image : (globalLogoUrl || 'https://via.placeholder.com/70');

                    categoriesHtml += `
                        <div class="category-card" onclick="openCategory('${cat.id}')">
                            <img src="${catImg}" class="category-img" alt="${cat.name}">
                            <h3>${cat.name}</h3>
                            <span class="category-code-tag">(${cat.id})</span>
                        </div>
                    `;
                });
                categoriesGrid.innerHTML = categoriesHtml;

                // بناء تفاصيل الأقسام ومحتواها
                const sectionsContainer = document.getElementById('sectionsContainer');
                let secHtml = '';

                categories.forEach((cat) => {
                    const catProducts = products.filter(p => p.category === cat.id || p.category === cat.name);
                    
                    let productsContent = '';
                    if(catProducts.length === 0) {
                        productsContent = '<p style="color:#888; text-align:center; padding:20px;">لا توجد منتجات في هذا القسم حالياً.</p>';
                    } else {
                        productsContent = `<div class="products-grid">` + catProducts.map(p => {
                            let images = p.images && p.images.length > 0 ? p.images : [];
                            let mainImg = images.length > 0 ? images[0] : '';
                            let thumbsHtml = images.length > 1 ? `
                                <div class="product-images">
                                    ${images.map(img => `<img src="${img}" onclick="changeMainImage(this, '${p.code}')">`).join('')}
                                </div>
                            ` : '';

                            let priceHtml = `<span class="price-ex">السعر: ${p.price} ₪</span>`;
                            if(isAgentLogged) {
                                priceHtml = `
                                    <span class="price-ex">سعر المعرض: ${p.price} ₪</span>
                                    <span class="price-agent">سعر الوسيط: ${p.agentPrice} ₪</span>
                                `;
                            }

                            return `
                                <div class="product-card">
                                    <div>
                                        ${mainImg ? `<img src="${mainImg}" class="main-product-img" id="main-img-${p.code}" onclick="openModal('${mainImg}')">` : ''}
                                        ${thumbsHtml}
                                        <h3>${p.name}</h3>
                                        <div class="prices">
                                            ${priceHtml}
                                            <span class="product-code">رمز المنتج: ${p.code}</span>
                                        </div>
                                    </div>
                                    <a href="https://wa.me/970597180456?text=أود طلب المنتج بررمز ${p.code}" target="_blank" class="whatsapp-btn">اطلب واتساب</a>
                                </div>
                            `;
                        }).join('') + `</div>`;
                    }

                    secHtml += `
                        <div id="section-${cat.id}" class="section">
                            <button class="back-to-categories" onclick="backToHome()">⬅ العودة للأقسام</button>
                            <h2>✨ ${cat.name} (${cat.id})</h2>
                            ${productsContent}
                        </div>
                    `;
                });

                sectionsContainer.innerHTML = secHtml;

            } catch (error) {
                console.error("Error loading catalog data from Firebase:", error);
            }
        }

        window.openCategory = function(catId) {
            document.getElementById('categoriesHomeView').style.display = 'none';
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active-section'));
            const targetSec = document.getElementById(`section-${catId}`);
            if(targetSec) {
                targetSec.classList.add('active-section');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        window.backToHome = function() {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active-section'));
            document.getElementById('categoriesHomeView').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.checkAgentSession = async function() {
            let loggedAgent = localStorage.getItem('eva_logged_agent');
            let statusText = document.getElementById('loginStatusText');
            let loginBtnUI = document.getElementById('loginBtnUI');

            if(loggedAgent) {
                statusText.innerHTML = `👋 أهلاً بكِ، <b>${loggedAgent}</b>`;
                loginBtnUI.innerText = "تسجيل خروج";
                loginBtnUI.style.background = "#e74c3c";
                loginBtnUI.onclick = logoutAgent;
            } else {
                statusText.innerHTML = "خاص بالوسيطات المعتمدات:";
                loginBtnUI.innerText = "دخول الوسيطات";
                loginBtnUI.style.background = "#ad1457";
                loginBtnUI.onclick = openLoginModal;
            }
        }

        window.openLoginModal = function() { document.getElementById('loginModal').style.display = 'flex'; }
        window.closeLoginModal = function() { document.getElementById('loginModal').style.display = 'none'; }

        window.handleAgentLogin = async function() {
            let u = document.getElementById('loginUser').value.trim();
            let p = document.getElementById('loginPass').value.trim();
            
            const agentsSnap = await getDocs(collection(db, "agents"));
            let found = null;
            agentsSnap.forEach(docItem => {
                let data = docItem.data();
                if(data.username === u && data.password === p) {
                    found = data;
                }
            });

            if(found) {
                localStorage.setItem('eva_logged_agent', found.name);
                closeLoginModal();
                alert(`أهلاً بكِ ${found.name}! تم تسجيل الدخول بنجاح.`);
                loadCatalogData();
                checkAgentSession();
            } else {
                alert('اسم المستخدم أو كلمة المرور غير صحيحة!');
            }
        }

        window.logoutAgent = function() {
            localStorage.removeItem('eva_logged_agent');
            alert('تم تسجيل الخروج بنجاح.');
            loadCatalogData();
            checkAgentSession();
        }

        window.changeMainImage = function(thumbElement, code) {
            const mainImg = document.getElementById(`main-img-${code}`);
            if(mainImg) mainImg.src = thumbElement.src;
        }

        window.openModal = function(src) { 
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            modal.style.display = 'flex'; 
            modalImg.src = src; 
        }
        window.closeModal = function() { 
            document.getElementById('imageModal').style.display = 'none'; 
        }

        loadCatalogData();
        checkAgentSession();
    </script>
</body>
</html>
